# Extra command-line switches for the Claude desktop app.
#
# One or more per line, '#' starts a comment. Lines are split on whitespace
# and quoting is not interpreted, so a switch's value cannot contain spaces.
# Nothing here is needed for the app to work; the file ships empty.
#
# This is the system-wide file. A per-user one is read after it, at
# ~/.config/claude-desktop-flags.conf (or under $XDG_CONFIG_HOME).
#
# These switches do NOT reach a session started by "Open at login". That
# autostart entry is written by the app itself and runs the real binary,
# /usr/lib/claude-desktop/claude-desktop, bypassing this launcher. To apply
# them there too, point the Exec= line of
# ~/.config/autostart/claude-desktop.desktop at claude-desktop.
#
# Environment variables do not belong here -- the launcher only passes
# switches. Export those from ~/.config/environment.d/ instead, which is also
# where ELECTRON_OZONE_PLATFORM_HINT=auto goes if you want Electron to pick
# the Wayland backend session-wide.
#
# Examples, all commented out:
#
#   Sharper text when the desktop's own scaling leaves the window blurry.
#   The value is absolute, not a multiplier on the desktop's scale factor.
# --force-device-scale-factor=1.5
#
#   Native Wayland for this app only, instead of XWayland.
# --ozone-platform=wayland
#
#   Software rendering, when the GPU process misbehaves.
# --disable-gpu
